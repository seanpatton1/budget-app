<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e9e5b">
  <title>Budget</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <nav class="sidenav" id="sidenav">
      <div class="brand">💷 Budget</div>
      <button class="navbtn active" data-view="home"><span class="ico">🏠</span><span>Home</span></button>
      <button class="navbtn" data-view="income"><span class="ico">💰</span><span>Income</span></button>
      <button class="navbtn" data-view="outgoings"><span class="ico">📤</span><span>Outgoings</span></button>
      <button class="navbtn" data-view="debts"><span class="ico">💳</span><span>Debts</span></button>
      <button class="navbtn" data-view="more"><span class="ico">⚙️</span><span>More</span></button>
    </nav>

    <main class="content">
      <section id="view-home" class="view active"></section>
      <section id="view-income" class="view"></section>
      <section id="view-outgoings" class="view"></section>
      <section id="view-debts" class="view"></section>
      <section id="view-more" class="view"></section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button class="tabbtn active" data-view="home"><span class="ico">🏠</span><span>Home</span></button>
      <button class="tabbtn" data-view="income"><span class="ico">💰</span><span>Income</span></button>
      <button class="tabbtn" data-view="outgoings"><span class="ico">📤</span><span>Out</span></button>
      <button class="tabbtn" data-view="debts"><span class="ico">💳</span><span>Debts</span></button>
      <button class="tabbtn" data-view="more"><span class="ico">⚙️</span><span>More</span></button>
    </nav>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
